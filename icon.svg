<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Enphase Envoy MQTT for Unraid icon</title>
  <desc id="desc">Light icon with sun, solar panel, wireless MQTT signal and gateway, matching the first concept.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5fbff"/>
      <stop offset="100%" stop-color="#e8f4ff"/>
    </linearGradient>

    <linearGradient id="sunGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd84a"/>
      <stop offset="100%" stop-color="#ffbc1f"/>
    </linearGradient>

    <linearGradient id="panelGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4eb7ff"/>
      <stop offset="100%" stop-color="#2f8fe8"/>
    </linearGradient>

    <linearGradient id="orangeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffbf42"/>
      <stop offset="100%" stop-color="#ff9726"/>
    </linearGradient>

    <linearGradient id="mqttGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#46b2ff"/>
      <stop offset="100%" stop-color="#2f8fe8"/>
    </linearGradient>

    <filter id="glowYellow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowBlue" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowOrange" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#7aa7d8" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Card -->
  <rect x="52" y="52" width="408" height="408" rx="72" fill="url(#bg)" fill-opacity="0.94" stroke="#ffffff" stroke-opacity="0.85" stroke-width="3" filter="url(#cardShadow)"/>

  <!-- Sun -->
  <g transform="translate(180 150)" filter="url(#glowYellow)">
    <g fill="url(#sunGrad)">
      <polygon points="0,-66 12,-34 -12,-34"/>
      <polygon points="43,-49 30,-20 13,-38"/>
      <polygon points="62,-9 32,-9 52,8"/>
      <polygon points="53,31 25,16 34,42"/>
      <polygon points="21,59 8,31 -8,31"/>
      <polygon points="-21,59 -8,31 8,31"/>
      <polygon points="-53,31 -34,42 -25,16"/>
      <polygon points="-62,-9 -52,8 -32,-9"/>
      <polygon points="-43,-49 -13,-38 -30,-20"/>
    </g>
    <circle r="46" fill="url(#sunGrad)"/>
  </g>

  <!-- Signal arcs -->
  <g fill="none" stroke="url(#orangeGrad)" stroke-linecap="round" filter="url(#glowOrange)">
    <path d="M308 198c39 0 70 31 70 70" stroke-width="13"/>
    <path d="M309 168c55 0 100 45 100 100" stroke-width="13"/>
    <path d="M309 138c72 0 130 58 130 130" stroke-width="13"/>
  </g>

  <!-- Solar panel -->
  <g transform="translate(114 208) skewX(-10)" filter="url(#glowBlue)">
    <rect x="0" y="0" width="126" height="96" rx="10" fill="#ffffff" fill-opacity="0.14"/>
    <rect x="8" y="8" width="46" height="36" rx="3" fill="url(#panelGrad)"/>
    <rect x="58" y="8" width="29" height="36" rx="3" fill="url(#panelGrad)"/>
    <rect x="91" y="8" width="27" height="36" rx="3" fill="url(#panelGrad)"/>
    <rect x="8" y="48" width="46" height="38" rx="3" fill="url(#panelGrad)"/>
    <rect x="58" y="48" width="29" height="38" rx="3" fill="url(#panelGrad)"/>
    <rect x="91" y="48" width="27" height="38" rx="3" fill="url(#panelGrad)"/>
  </g>

  <!-- Panel stand -->
  <path d="M129 311h82l-8 26h-89z" fill="#173451"/>

  <!-- Gateway / device -->
  <g filter="url(#glowOrange)">
    <rect x="188" y="257" width="153" height="68" rx="23" fill="url(#orangeGrad)"/>
    <circle cx="222" cy="291" r="9" fill="#f4d48d"/>
    <rect x="287" y="279" width="18" height="18" rx="2" fill="#f3b54e"/>
    <rect x="311" y="279" width="18" height="18" rx="8" fill="#ffd48a"/>
  </g>

  <!-- MQTT text -->
  <text x="256" y="410"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="74"
        font-weight="800"
        letter-spacing="1.5"
        fill="url(#mqttGrad)"
        filter="url(#glowBlue)">MQTT</text>
</svg>
