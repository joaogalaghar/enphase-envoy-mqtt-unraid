<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Enphase Envoy MQTT for Unraid icon</title>
  <desc id="desc">A generic solar gateway sending MQTT waves, designed for the Enphase Envoy MQTT for Unraid community project.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="solar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect x="20" y="20" width="472" height="472" rx="104" fill="url(#bg)"/>

  <g transform="translate(126 124)">
    <circle r="42" fill="url(#solar)"/>
    <g stroke="#fbbf24" stroke-width="12" stroke-linecap="round">
      <line x1="0" y1="-70" x2="0" y2="-88"/>
      <line x1="0" y1="70" x2="0" y2="88"/>
      <line x1="-70" y1="0" x2="-88" y2="0"/>
      <line x1="70" y1="0" x2="88" y2="0"/>
      <line x1="-50" y1="-50" x2="-63" y2="-63"/>
      <line x1="50" y1="-50" x2="63" y2="-63"/>
      <line x1="-50" y1="50" x2="-63" y2="63"/>
      <line x1="50" y1="50" x2="63" y2="63"/>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="116" y="238" width="218" height="148" rx="34" fill="#f8fafc"/>
    <rect x="144" y="266" width="162" height="72" rx="18" fill="#e2e8f0"/>
    <circle cx="166" cy="360" r="10" fill="#22c55e"/>
    <circle cx="196" cy="360" r="10" fill="#94a3b8"/>
    <path d="M178 302h94" stroke="#64748b" stroke-width="12" stroke-linecap="round"/>
  </g>

  <g fill="none" stroke="url(#signal)" stroke-width="18" stroke-linecap="round">
    <path d="M340 248c50 8 90 48 98 98"/>
    <path d="M352 296c26 6 46 26 52 52"/>
  </g>
  <circle cx="366" cy="356" r="14" fill="#38bdf8"/>

  <path d="M153 169c0 34 22 48 22 69" fill="none" stroke="#f59e0b" stroke-width="14" stroke-linecap="round"/>
  <path d="M159 230l16 18 16-18" fill="none" stroke="#f59e0b" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

  <g aria-hidden="true">
    <rect x="304" y="402" width="124" height="46" rx="23" fill="#172554"/>
    <text x="366" y="433" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="23" font-weight="700" letter-spacing="1.4" fill="#bfdbfe">MQTT</text>
  </g>
</svg>
